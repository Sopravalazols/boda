<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ilan &amp; Cata | Fotos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alice&family=Noto+Serif:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #EFE8E8;
    --vino: #8F0F0F;
    --vino-oscuro: #6E0A0A;
    --rosa: #B98C8C;
    --pista: #DDCACA;
    --titulo: 'Noto Serif', Georgia, serif;
    --texto: 'Alice', Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--fondo);
    color: var(--vino);
    font-family: var(--texto);
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .pagina { max-width: 30rem; margin: 0 auto; padding: 2.5rem 1.75rem 4rem; }

  .nombres {
    font-family: var(--titulo);
    font-weight: 400;
    font-size: clamp(2rem, 9.5vw, 3rem);
    letter-spacing: .3em;
    line-height: 1.1;
    margin: 0;
  }
  .fecha {
    margin: .9rem 0 0;
    font-weight: 700;
    font-size: clamp(.95rem, 4.4vw, 1.2rem);
    letter-spacing: .26em;
    white-space: nowrap;
  }
  .regla { width: 55%; height: 2px; background: var(--vino); border: 0; margin: 1.5rem 0 0; }
  .intro { margin: 1.5rem 0 0; font-size: 1.1rem; }

  .campo { margin: 1.5rem 0 0; }
  .campo label { display: block; font-size: 1rem; margin-bottom: .1rem; }
  .campo input {
    width: 100%; font: inherit; color: var(--vino); background: transparent;
    border: 0; border-bottom: 1px solid var(--rosa); border-radius: 0; padding: .4rem 0;
  }
  .campo input::placeholder { color: var(--rosa); }
  .campo input:focus { outline: none; border-bottom-color: var(--vino); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .boton {
    display: block; width: 100%; margin-top: 1.5rem;
    background: var(--vino); color: var(--fondo);
    font-family: var(--titulo); font-size: 1rem; letter-spacing: .18em; text-transform: uppercase; text-align: center;
    padding: 1.1rem 1rem; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    transition: background-color .15s ease, transform .15s ease;
  }
  .boton:hover { background: var(--vino-oscuro); }
  .boton:active { background: var(--vino-oscuro); transform: scale(.98); }
  #selector:focus-visible + .boton { outline: 2px solid var(--vino); outline-offset: 4px; }

  .aviso { margin: .9rem 0 0; font-size: .95rem; }
  .resumen { margin: 2rem 0 0; font-size: 1.1rem; font-weight: 700; }
  .resumen:empty { display: none; }

  .lista { list-style: none; margin: 1rem 0 0; padding: 0; }
  .item { padding: .85rem 0; border-top: 1px solid var(--pista); }
  .item:last-child { border-bottom: 1px solid var(--pista); }
  .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; font-size: .95rem; }
  .nombre-archivo { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .estado { flex: none; font-variant-numeric: tabular-nums; color: var(--rosa); }
  .barra { height: 2px; margin-top: .5rem; background: var(--pista); overflow: hidden; }
  .barra span { display: block; height: 100%; width: 0; background: var(--vino); transition: width .3s ease; }
  .item.listo .estado, .item.error .estado { color: var(--vino); font-weight: 700; }
  .detalle { margin: .35rem 0 0; font-size: .9rem; font-style: italic; }
  .reintentar {
    margin-top: .5rem; font-family: var(--titulo); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--vino); background: transparent; border: 1px solid var(--vino); padding: .4rem .9rem; cursor: pointer;
  }
  .reintentar:focus-visible { outline: 2px solid var(--vino); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="pagina">
  <h1 class="nombres">ILAN&amp;CATA</h1>
  <p class="fecha">11 | OCTUBRE | 2026</p>
  <hr class="regla">

  <p class="intro">Gracias por acompañarnos en un día tan especial. Nos encantaría ver las fotos y videos que sacaron; compártelos aquí y nos llegan directo, en su calidad original.</p>

  <div class="campo">
    <label for="invitado">Tu nombre</label>
    <input id="invitado" type="text" maxlength="40" autocomplete="name" placeholder="Opcional, para saber de quién son">
  </div>

  <input id="selector" class="sr" type="file" accept="image/*,video/*" multiple>
  <label for="selector" class="boton">Subir fotos y videos</label>

  <p class="aviso">Puedes elegir varios archivos a la vez. Deja esta página abierta hasta que todos digan Listo.</p>

  <p class="resumen" id="resumen" aria-live="polite"></p>
  <ul class="lista" id="lista"></ul>
</main>

<script>
  const TAMANO_TROZO = 8 * 1024 * 1024; // múltiplo de 256 KB, requisito de Drive
  const API = 'https://script.google.com/macros/s/AKfycbzIyM8FyHowPRDdGqpDee3dEEJ5CVF9TPJwevgbdQfTyvDpBz0ZVkMY8ow5l5O5m_ZEOw/exec';
  const MAX_MB = 2048;
  const MAX_INTENTOS = 6;

  const cola = [];
  let trabajando = false;
  let listos = 0;
  let fallidos = 0;
  let wakeLock = null;

  const $ = (id) => document.getElementById(id);

  $('selector').addEventListener('change', (e) => {
    const archivos = Array.from(e.target.files || []);
    e.target.value = '';
    archivos.forEach(agregar);
    procesar();
  });

  window.addEventListener('beforeunload', (e) => {
    if (trabajando) { e.preventDefault(); e.returnValue = ''; }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && trabajando) activarPantalla();
  });

  function agregar(file) {
    const li = document.createElement('li');
    li.className = 'item';
    li.innerHTML = '<div class="fila"><span class="nombre-archivo"></span><span class="estado">En cola</span></div><div class="barra"><span></span></div>';
    li.querySelector('.nombre-archivo').textContent = file.name + ' (' + formatoTamano(file.size) + ')';
    $('lista').prepend(li);

    const item = { file, li };
    if (file.size === 0) return marcarError(item, 'El archivo está vacío.', false);
    if (file.size > MAX_MB * 1024 * 1024) return marcarError(item, 'Supera el máximo de ' + MAX_MB + ' MB.', false);
    cola.push(item);
  }

  async function procesar() {
    if (trabajando) return;
    trabajando = true;
    activarPantalla();
    actualizarResumen();
    while (cola.length) {
      const item = cola.shift();
      try {
        await subirArchivo(item);
        listos++;
        marcarListo(item);
      } catch (err) {
        marcarError(item, mensaje(err), true);
      }
      actualizarResumen();
    }
    trabajando = false;
    soltarPantalla();
    actualizarResumen();
  }

  async function subirArchivo(item) {
    const f = item.file;
    const invitado = $('invitado').value.trim();
    ponerEstado(item, 'Preparando');

    const url = await conReintentos(() =>
      llamar('iniciarSubida', { nombre: f.name, tipo: f.type, tamano: f.size, invitado })
    );

    let inicio = 0;
    let intentos = 0;
    while (inicio < f.size) {
      try {
        const b64 = await leerBase64(f.slice(inicio, Math.min(inicio + TAMANO_TROZO, f.size)));
        const r = await llamar('subirParte', url, b64, inicio, f.size);
        intentos = 0;
        inicio = r.listo ? f.size : r.siguiente;
      } catch (err) {
        intentos++;
        if (intentos > MAX_INTENTOS) throw err;
        ponerEstado(item, 'Reconectando');
        await esperar(1500 * intentos);
        try {
          const e = await llamar('estadoSubida', url, f.size);
          inicio = e.listo ? f.size : e.siguiente;
        } catch (_) { /* se reintenta desde el mismo punto */ }
      }
      ponerProgreso(item, inicio / f.size);
    }
  }

  // ---------- helpers ----------
  async function llamar(accion, ...args) {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita el preflight CORS
      body: JSON.stringify({ accion, args }),
      credentials: 'omit', // no envía las cuentas de Google del invitado
      redirect: 'follow'
    });
    if (!r.ok) throw new Error('Error de conexión (' + r.status + ').');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    return j.data;
  }

  async function conReintentos(tarea) {
    for (let i = 0; ; i++) {
      try { return await tarea(); }
      catch (err) {
        const definitivo = /máximo|vacío|Solo se aceptan|cerradas|configurar/.test(mensaje(err));
        if (definitivo || i >= MAX_INTENTOS) throw err;
        await esperar(1500 * (i + 1));
      }
    }
  }

  function leerBase64(blob) {
    return new Promise((ok, mal) => {
      const r = new FileReader();
      r.onload = () => ok(String(r.result).split(',')[1] || '');
      r.onerror = () => mal(r.error || new Error('No se pudo leer el archivo.'));
      r.readAsDataURL(blob);
    });
  }

  const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

  function mensaje(err) {
    const m = err && err.message ? String(err.message).replace(/^Exception:\s*/, '') : '';
    return m || 'Revisa tu conexión e inténtalo de nuevo.';
  }

  function ponerEstado(item, texto) { item.li.querySelector('.estado').textContent = texto; }

  function ponerProgreso(item, p) {
    const pct = Math.min(100, Math.floor(p * 100));
    item.li.querySelector('.barra span').style.width = pct + '%';
    ponerEstado(item, pct + ' %');
  }

  function marcarListo(item) {
    item.li.classList.add('listo');
    item.li.querySelector('.barra span').style.width = '100%';
    ponerEstado(item, 'Listo');
  }

  function marcarError(item, texto, reintentable) {
    fallidos++;
    item.li.classList.add('error');
    ponerEstado(item, 'No se subió');
    const p = document.createElement('p');
    p.className = 'detalle';
    p.textContent = texto;
    item.li.appendChild(p);
    if (reintentable) {
      const b = document.createElement('button');
      b.className = 'reintentar';
      b.type = 'button';
      b.textContent = 'Reintentar';
      b.onclick = () => {
        fallidos--;
        p.remove(); b.remove();
        item.li.classList.remove('error');
        item.li.querySelector('.barra span').style.width = '0';
        ponerEstado(item, 'En cola');
        cola.push(item);
        procesar();
        actualizarResumen();
      };
      item.li.appendChild(b);
    }
    actualizarResumen();
  }

  function actualizarResumen() {
    let t = '';
    if (trabajando) {
      t = 'Subiendo, deja esta página abierta.';
    } else if (listos > 0) {
      t = listos === 1 ? 'Llegó 1 archivo. Gracias por compartirlo.' : 'Llegaron ' + listos + ' archivos. Gracias por compartirlos.';
    }
    if (!trabajando && fallidos > 0) {
      t += (t ? ' ' : '') + (fallidos === 1 ? '1 no se pudo subir.' : fallidos + ' no se pudieron subir.');
    }
    $('resumen').textContent = t;
  }

  function formatoTamano(b) {
    if (b >= 1024 * 1024 * 1024) return (b / 1024 / 1024 / 1024).toFixed(1) + ' GB';
    if (b >= 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + ' MB';
    return Math.max(1, Math.round(b / 1024)) + ' KB';
  }

  async function activarPantalla() {
    try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }
    catch (_) { wakeLock = null; }
  }
  function soltarPantalla() {
    try { if (wakeLock) wakeLock.release(); } catch (_) {}
    wakeLock = null;
  }
</script>
</body>
</html>
